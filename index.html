<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eduardo Arraes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <nav class="fixed top-0 left-0 w-full z-50">
      <div class="max-w-6xl mx-auto px-6 py-4">
          <div
              class="flex items-center justify-between rounded-2xl border border-white/10 bg-black/40 backdrop-blur-xl px-6 py-3 shadow-2xl">
              <!-- Logo -->
              <a href="#home"
                  id="nome"
                  class="text-xl font-bold tracking-wide text-white transition hover:text-gray-300">
              </a>
              <!-- Menu -->
              <ul class="hidden md:flex items-center gap-8 text-sm font-medium">
                  <li>
                      <a href="#sobre"
                          class="text-gray-400 hover:text-white transition duration-300">
                          Sobre
                      </a>
                  </li>
                  <li>
                      <a href="#habilidades"
                          class="text-gray-400 hover:text-white transition duration-300">
                          Habilidades
                      </a>
                  </li>
                  <li>
                      <a href="#projetos"
                          class="text-gray-400 hover:text-white transition duration-300">
                          Projetos
                      </a>
                  </li>
                  <li>
                      <a href="#blog"
                          class="text-gray-400 hover:text-white transition duration-300">
                          Blog
                      </a>
                  </li>
              </ul>
              <!-- Botão -->
              <a href="#contato"
                  class="rounded-full border border-white/20 bg-white px-5 py-2 text-sm font-semibold text-black transition-all duration-300 hover:scale-105 hover:bg-gray-200">
                  Vamos conversar
              </a>
          </div>
      </div>
  </nav>

  <main class="mx-auto mt-24 px-4" style="max-width: 850px;">

    <!-- Hero -->
    <section id="home" class="text-center py-12">
      <h1 id="titulo-texto" class="text-4xl md:text-5xl font-extrabold mb-4"></h1>
      <p id="resumo-texto" class="text-lg text-gray-400 mb-8"></p>
      <div class="flex justify-center gap-3">
        <a href="#projetos" class="btn-white">ver projetos</a>
        <a href="#sobre" class="rounded-full px-4 py-2 border border-white/20 text-white inline-block">sobre mim</a>
      </div>
    </section>

    <!-- Sobre -->
    <section id="sobre" class="section-card">
      <h2 class="mb-4 text-2xl font-semibold">sobre</h2>
      <p id="sobre-texto" class="text-gray-400 text-lg leading-relaxed"></p>
    </section>

    <!-- Habilidades -->
    <section id="habilidades" class="mb-10 text-center">
      <div id="lista-habilidades"></div>
    </section>

    <!-- Projetos -->
    <section id="projetos" class="mb-10">
      <h2 class="mb-4 text-2xl font-semibold">projetos</h2>
      <div id="lista-projetos" class="grid gap-6"></div>
    </section>

    <!-- Blog -->
    <section id="blog" class="section-card">
      <h2 class="mb-4 text-2xl font-semibold">blog</h2>
      <div id="lista-blog"></div>
    </section>

    <!-- Contato -->
    <section id="contato" class="text-center py-12">
      <h2 class="mb-4 text-2xl font-semibold">vamos conversar?</h2>
      <div id="contato-info" class="flex justify-center gap-4 flex-wrap"></div>
    </section>

  </main>

  <footer class="py-5 text-center text-gray-400 border-t border-gray-800 mt-5">
    <p>© 2026 <span id="nome-footer"></span></p>
  </footer>

  <script>
    fetch('dados.json')
      .then(response => response.json())
      .then(dados => {
        document.getElementById('nome').textContent = dados.nome.toLowerCase();
        document.getElementById('nome-footer').textContent = dados.nome;
        document.getElementById('sobre-texto').textContent = dados.sobre;
        document.getElementById('titulo-texto').textContent = dados.titulo;
        document.getElementById('resumo-texto').textContent = dados.resumo;

        const hab = document.getElementById('lista-habilidades');
        dados.habilidades.forEach(h => {
          hab.innerHTML += `<span class="badge-pill">${h}</span>`;
        });

        const proj = document.getElementById('lista-projetos');
        dados.projetos.forEach(p => {
          proj.innerHTML += `
            <div class="w-full">
              <div class="section-card mb-0 h-full">
                <h4 class="text-white font-bold">${p.titulo}</h4>
                <p class="text-gray-400">${p.descricao}</p>
                <a href="${p.link}" target="_blank" class="text-white font-bold text-sm">explorar projeto ↗</a>
              </div>
            </div>`;
        });

        const blog = document.getElementById('lista-blog');
        dados.blog.forEach(post => {
          blog.innerHTML += `
            <a href="${post.link}" class="flex justify-between items-center py-3 px-0 bg-transparent text-gray-400 border-t border-gray-800" target="_blank">
              ${post.titulo}
              <span class="text-white">→</span>
            </a>`;
        });

        const contato = document.getElementById('contato-info');
        contato.innerHTML = `
          <a href="mailto:${dados.contato.email}" class="btn-white">email</a>
          <a href="${dados.contato.linkedin}" target="_blank" class="rounded-full px-4 py-2 border border-white/20 text-white inline-block">linkedin</a>
          <a href="${dados.contato.github}" target="_blank" class="rounded-full px-4 py-2 border border-white/20 text-white inline-block">github</a>
          <a href="${dados.contato.medium}" target="_blank" class="rounded-full px-4 py-2 border border-white/20 text-white inline-block">medium</a>
          <a href="${dados.contato.youtube}" target="_blank" class="rounded-full px-4 py-2 border border-white/20 text-white inline-block">youtube</a>
        `;
      });
  </script>

</body>
</html>
