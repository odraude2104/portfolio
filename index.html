<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eduardo Arraes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding-top: 80px;
    }

    /* Navbar Minimalista */
    .navbar {
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
    }

    /* Botão Branco Redondo */
    .btn-white {
      background-color: #ffffff;
      color: #000000;
      border-radius: 50px;
      padding: 10px 25px;
      font-weight: 700;
      border: none;
      transition: transform 0.2s ease;
    }
    .btn-white:hover {
      background-color: #e2e2e2;
      transform: scale(1.05);
    }

    /* Cards e Seções */
    .section-card {
      background-color: #111111;
      border-radius: 30px;
      padding: 40px;
      margin-bottom: 30px;
      border: 1px solid #222222;
    }

    .badge-pill {
      background-color: #ffffff;
      color: #000000;
      border-radius: 50px;
      padding: 8px 20px;
      font-weight: 600;
      text-transform: lowercase;
      margin: 5px;
      display: inline-block;
    }

    h1, h2 {
      font-weight: 700;
      letter-spacing: -1px;
    }

    .nav-link {
      color: #888888 !important;
      font-weight: 500;
    }
    .nav-link:hover {
      color: #ffffff !important;
    }

    /* Remover decorações de links */
    a { text-decoration: none; }
  </style>
</head>
<body>

  <!-- Navegação -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
      <a class="navbar-brand text-white fw-bold fs-4" href="#" id="nome"></a>
      <div class="ms-auto">
        <a class="btn-white shadow-sm" href="#contato">contato</a>
      </div>
    </div>
  </nav>

  <main class="container mt-5" style="max-width: 850px;">

    <!-- Hero -->
    <section id="home" class="text-center py-5">
      <h1 class="display-3 mb-4">Criando experiências através do design e código.</h1>
      <p class="lead text-secondary mb-5">Analista de TI e desenvolvedor focado em simplicidade e eficiência.</p>
      <div class="d-flex justify-content-center gap-3">
        <a href="#projetos" class="btn-white">ver projetos</a>
        <a href="#sobre" class="btn btn-outline-light rounded-pill px-4">sobre mim</a>
      </div>
    </section>

    <!-- Sobre -->
    <section id="sobre" class="section-card">
      <h2 class="mb-4">sobre</h2>
      <p id="sobre-texto" class="text-secondary fs-5 lh-base"></p>
    </section>

    <!-- Habilidades -->
    <section id="habilidades" class="mb-5 text-center">
      <div id="lista-habilidades"></div>
    </section>

    <!-- Projetos -->
    <section id="projetos" class="mb-5">
      <h2 class="mb-4">projetos</h2>
      <div id="lista-projetos" class="row g-4"></div>
    </section>

    <!-- Blog -->
    <section id="blog" class="section-card">
      <h2 class="mb-4">blog</h2>
      <div id="lista-blog" class="list-group list-group-flush"></div>
    </section>

    <!-- Contato -->
    <section id="contato" class="text-center py-5">
      <h2 class="mb-4">vamos conversar?</h2>
      <div id="contato-info" class="d-flex justify-content-center gap-4 flex-wrap"></div>
    </section>

  </main>

  <footer class="py-5 text-center text-secondary border-top border-secondary mt-5">
    <p>© 2026 <span id="nome-footer"></span></p>
  </footer>

  <script>
    fetch('dados.json')
      .then(response => response.json())
      .then(dados => {
        document.getElementById('nome').textContent = dados.nome.toLowerCase();
        document.getElementById('nome-footer').textContent = dados.nome;
        document.getElementById('sobre-texto').textContent = dados.sobre;

        const hab = document.getElementById('lista-habilidades');
        dados.habilidades.forEach(h => {
          hab.innerHTML += `<span class="badge-pill">${h}</span>`;
        });

        const proj = document.getElementById('lista-projetos');
        dados.projetos.forEach(p => {
          proj.innerHTML += `
            <div class="col-12">
              <div class="section-card mb-0 h-100">
                <h4 class="text-white fw-bold">${p.titulo}</h4>
                <p class="text-secondary">${p.descricao}</p>
                <a href="${p.link}" target="_blank" class="text-white fw-bold small">explorar projeto ↗</a>
              </div>
            </div>`;
        });

        const blog = document.getElementById('lista-blog');
        dados.blog.forEach(post => {
          blog.innerHTML += `
            <a href="${post.link}" class="list-group-item bg-transparent text-secondary border-secondary py-3 px-0 d-flex justify-content-between align-items-center" target="_blank">
              ${post.titulo}
              <span class="text-white">→</span>
            </a>`;
        });

        const contato = document.getElementById('contato-info');
        contato.innerHTML = `
          <a href="mailto:${dados.contato.email}" class="btn-white">email</a>
          <a href="${dados.contato.linkedin}" target="_blank" class="btn btn-outline-light rounded-pill px-4">linkedin</a>
          <a href="${dados.contato.github}" target="_blank" class="btn btn-outline-light rounded-pill px-4">github</a>
        `;
      });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
